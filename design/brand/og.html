<!doctype html>
<!-- Lucent · 灵感台 — social preview (src/web/og.jpg), rendered by scripts/og.mjs at 1280×640.
     The picture is a rendered capture of the product (backdrop.jpg); only the mark and the tagline are set here.
     Type: Inter, Lora and Noto Serif CJK SC, as installed on the rendering machine. -->
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #0b111a; }
  .shot { position: absolute; left: 0; top: -74px; width: 1280px; height: auto; }
  .shade { position: absolute; inset: 0;
    background:
      linear-gradient(0deg, rgba(6, 9, 15, .82) 0%, rgba(6, 9, 15, .55) 17%, rgba(6, 9, 15, 0) 40%),
      radial-gradient(120% 90% at 50% 40%, rgba(0, 0, 0, 0) 60%, rgba(4, 7, 12, .35) 100%); }
  .mark { position: absolute; left: 56px; bottom: 74px; display: flex; align-items: center; gap: 20px; color: #F4F1EA; }
  .mark strong { font: 400 34px/1 "Inter", sans-serif; letter-spacing: 9px; }
  .mark span { border-left: 1px solid rgba(244, 241, 234, .38); padding-left: 20px; font: 400 17px/1 "Noto Serif CJK SC", serif; letter-spacing: 6px; color: rgba(244, 241, 234, .82); }
  .line { position: absolute; left: 58px; bottom: 40px; font: 400 15px/1 "Noto Serif CJK SC", serif; letter-spacing: 3px; color: rgba(244, 241, 234, .72); }
  .line em { font: italic 400 15px/1 "Lora", Georgia, serif; letter-spacing: .5px; margin-left: 14px; color: rgba(244, 241, 234, .56); }
</style></head>
<body>
  <img class="shot" src="backdrop.jpg" alt="">
  <div class="shade"></div>
  <div class="mark"><strong>LUCENT</strong><span>灵感台</span></div>
  <div class="line">由此出发，为光停留。<em>Launch from here. Stay for the light.</em></div>
</body></html>
